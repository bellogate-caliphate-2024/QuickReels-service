name: Quickreels Workflow

on:
  push:
    branches:
      - emp
  pull_request:
    branches:
      - emp

permissions:
  contents: read
  packages: read
  statuses: write

env:
  NODE_PATH: ./src
  CI: true

jobs:
  lint_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Dependencies
        run: |
          yarn install
          yarn add -D tsconfig-paths @types/node
          pip install checkov

      - name: Configure Paths
        run: |
          echo "::add-path::$GITHUB_WORKSPACE/node_modules/.bin"

      - name: Run Tests
        run: |
          yarn test --config jest.config.js --passWithNoTests

      - name: Run Super Linter
        uses: super-linter/super-linter@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: emp
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_JSCPD: false
          VALIDATE_YAML: false
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_TYPESCRIPT_STANDARD: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_TYPESCRIPT_PRETTIER: false
          JSCPD_CONFIG_FILE: .jscpd.json
          LOG_LEVEL: DEBUG
          FILTER_REGEX_EXCLUDE: .*test.*|.*mock.*
          CHECKOV_FILE: .checkov.yaml

      - name: Run Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: true
          framework: terraform
          quiet: true
          download_external_modules: true
          skip_check: CKV_AWS_23,CKV_AWS_24  # Skip specific checks if needed